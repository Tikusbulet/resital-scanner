<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner QR Peserta Resital 2026</title>

  <style>
    * {
      box-sizing: border-box;
     }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin: 5px 0 8px;
      font-size: 26px;
      color: #7b1e1e;
    }

    .subtitle {
      text-align: center;
      font-size: 16px;
      margin-bottom: 20px;
      color: #666;
    }

    #reader {
      width: 100%;
      min-height: 280px;
      background: #111;
      border-radius: 15px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      font-size: 17px;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      margin-top: 15px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      background: #7b1e1e;
      color: white;
    }

    .button:active {
      transform: scale(0.98);
    }

    .success {
      color: #187a2f;
      font-weight: bold;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SCAN QR PESERTA</h1>

  <div class="subtitle">
    Resital Du Jing 2026
  </div>


  <div id="reader">
    <span style="color:white;">
      Kamera belum dibuka
    </span>
  </div>

  <button class="button" onclick="mulaiScanner()">
    BUKA KAMERA
  </button>

  <div id="status">
    Tekan tombol untuk membuka kamera.
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>

let video = null;
let canvas = null;
let ctx = null;
let scanning = false;
let stream = null;


/* =====================================================
   URL WEB APP RESITAL
   ===================================================== */

const APP_URL =
  "https://script.google.com/macros/s/AKfycbzYsf6G8PxGFmnVaPVrBKbn3mHRiqzQKRjWHc2ByjlyFOJgg8RoLuL5OGZ18Ag7gmkr/exec";

/* =====================================================
   MULAI SCANNER
   ===================================================== */

function mulaiScanner() {

  if (scanning) {
    return;
  }

  document.getElementById("status").innerHTML =
    "Meminta akses kamera...";

  video = document.createElement("video");

  video.setAttribute("playsinline", "");
  video.setAttribute("autoplay", "");
  video.setAttribute("muted", "");

  video.style.width = "100%";
  video.style.height = "auto";
  video.style.display = "block";

  const reader = document.getElementById("reader");

  reader.innerHTML = "";
  reader.appendChild(video);

  canvas = document.createElement("canvas");

  ctx = canvas.getContext("2d", {
    willReadFrequently: true
  });

  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: {
        ideal: "environment"
      }
    },
    audio: false
  })

  .then(function(s) {

    stream = s;

    video.srcObject = stream;

    video.play();

    scanning = true;

    document.getElementById("status").innerHTML =
      "Arahkan kamera ke QR Code peserta.";

    requestAnimationFrame(scanFrame);

  })

  .catch(function(error) {

    console.error(error);

    document.getElementById("status").innerHTML =
      "<div class='error'>" +
      "Kamera tidak dapat dibuka.<br><br>" +
      "Pastikan izin kamera diberikan kepada browser." +
      "</div>";

  });
}


/* =====================================================
   BACA FRAME KAMERA
   ===================================================== */

function scanFrame() {

  if (!scanning) {
    return;
  }

  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const imageData = ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

    const code = jsQR(
      imageData.data,
      imageData.width,
      imageData.height
    );

    if (code) {

      qrDitemukan(code.data);

      return;
    }
  }

  requestAnimationFrame(scanFrame);
}


/* =====================================================
   QR DITEMUKAN
   ===================================================== */

function qrDitemukan(data) {

  scanning = false;

  /* Matikan kamera */
  if (stream) {

    stream.getTracks().forEach(function(track) {
      track.stop();
    });

  }

  document.getElementById("status").innerHTML =
    "<div class='success'>" +
    "✓ QR BERHASIL DIBACA<br>" +
    "Membuka data peserta..." +
    "</div>";

  /* Ambil ID peserta dari QR */
  const idPeserta = ambilIDPeserta(data);

  if (!idPeserta) {

    document.getElementById("status").innerHTML =
      "<div class='error'>" +
      "QR tidak dikenali sebagai QR Peserta Resital." +
      "</div>";

    return;
  }

  /* Tunggu sebentar agar status terlihat */
  setTimeout(function() {

    bukaPeserta(idPeserta);

  }, 500);
}


/* =====================================================
   AMBIL ID PESERTA DARI QR
   ===================================================== */

function ambilIDPeserta(data) {

  try {

    const url = new URL(String(data).trim());

    const id = url.searchParams.get("id");

    if (id) {

      return String(id).trim();

    }

  } catch (error) {

    console.log(
      "QR bukan URL:",
      data
    );

  }

  return "";
}


/* =====================================================
   BUKA WEB APP PESERTA
   ===================================================== */

function bukaPeserta(idPeserta) {

  const tujuan =
    APP_URL +
    "?id=" +
    encodeURIComponent(idPeserta);

  window.location.href = tujuan;
}

</script>

</body>
</html>
